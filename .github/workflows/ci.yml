name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check version was bumped
        run: |
          current=$(jq -r '.version' package.json)
          main=$(git show origin/main:package.json | jq -r '.version')
          if [ "$current" = "$main" ]; then
            echo "❌ Version is still $current — bump it in package.json before merging."
            exit 1
          fi
          echo "✅ Version bumped: $main → $current"
